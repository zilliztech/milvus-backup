cluster:
  enabled: false
image:
  all:
    repository: milvusdb/milvus
    tag: master-latest
    pullPolicy: IfNotPresent

kafka:
  enabled: false
  name: kafka
  replicaCount: 3
  defaultReplicationFactor: 2

etcd:
  replicaCount: 1
  image:
    repository: milvusdb/etcd
    tag: 3.5.0-r7
minio:
  mode: standalone
  # Docker Hub deleted the minio/minio repository; MinIO's quay namespace
  # still serves the same release tags, so pull from there instead.
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2024-05-28T17-19-04Z
pulsar:
  enabled: false