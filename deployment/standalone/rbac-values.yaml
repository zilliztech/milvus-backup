cluster:
  enabled: false
image:
  all:
    repository: milvusdb/milvus
    tag: master-latest
    pullPolicy: IfNotPresent

kafka:
  enabled: false
  name: kafka
  replicaCount: 3
  defaultReplicationFactor: 2

etcd:
  replicaCount: 1
  image:
    repository: milvusdb/etcd
    tag: 3.5.0-r7
minio:
  mode: standalone
  # The upstream minio/minio images are gone from both Docker Hub and quay;
  # milvusdb/minio is the Zilliz-maintained multi-arch mirror on Docker Hub
  # (synced from the approved source image, see milvus-io/milvus#53889).
  image:
    repository: milvusdb/minio
    tag: RELEASE.2024-12-18T13-15-44Z
pulsar:
  enabled: false

pulsarv3:
  enabled: false

extraConfigFiles:
  user.yaml: |+
    common:
      security:
        authorizationEnabled: true
