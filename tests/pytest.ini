[pytest]


addopts = --host localhost --html=/tmp/ci_logs/report.html --self-contained-html -v --log-cli-level=INFO --capture=no
#  python3 -W ignore -m pytest

# pytest-timeout umbrella: a single unbounded server-side wait (index build,
# load, flush) must fail the case, not hang the whole CI leg until the job
# timeout kills every test still queued behind it.
# pytest-parallel runs cases in threads, so the default signal method crashes
# with "signal only works in main thread"; thread method is the compatible one.
timeout = 1800
timeout_method = thread

log_format = [%(asctime)s - %(levelname)s - %(name)s]: %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S


filterwarnings =
    ignore::DeprecationWarning
