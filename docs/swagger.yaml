basePath: /api/v1
definitions:
  apiv1.BackupInfoBrief:
    properties:
      backup_timestamp:
        type: integer
      collection_backups:
        items:
          $ref: '#/definitions/apiv1.CollectionBackupInfoBrief'
        type: array
      database_backups:
        items:
          $ref: '#/definitions/backuppb.DatabaseBackupInfo'
        type: array
      end_time:
        type: integer
      errorMessage:
        type: string
      format:
        description: See BackupInfo.format.
        type: string
      id:
        description: From the task.
        type: string
      meta_size:
        description: Sum of all meta files size.
        type: integer
      milvus_version:
        type: string
      name:
        description: From the backup meta.
        type: string
      progress:
        type: integer
      rpc_channel_info:
        $ref: '#/definitions/backuppb.RPCChannelInfo'
      size:
        type: integer
      start_time:
        type: integer
      state_code:
        $ref: '#/definitions/backuppb.BackupTaskStateCode'
    type: object
  apiv1.BackupInfoResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/backuppb.ResponseCode'
        description: Response code. 0 means success, others fail. Absent on success.
      data:
        allOf:
        - $ref: '#/definitions/apiv1.BackupInfoBrief'
        description: Backup info entity; null when the response carries none.
      msg:
        description: Error msg if fail.
        type: string
      requestId:
        description: Uuid of the request answered.
        type: string
    type: object
  apiv1.BackupSummary:
    properties:
      id:
        type: string
      milvus_version:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  apiv1.CollFilter:
    properties:
      colls:
        items:
          type: string
        type: array
    type: object
  apiv1.CollectionBackupInfoBrief:
    properties:
      backup_physical_timestamp:
        description: Physical unix time of backup.
        type: integer
      backup_timestamp:
        description: Logical time of backup, used for restore.
        type: integer
      channel_checkpoints:
        additionalProperties:
          type: string
        type: object
      collection_id:
        type: integer
      collection_name:
        type: string
      db_name:
        type: string
      has_index:
        type: boolean
      id:
        type: string
      index_infos:
        items:
          $ref: '#/definitions/backuppb.IndexInfo'
        type: array
      load_state:
        type: string
      properties:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
      schema:
        $ref: '#/definitions/backuppb.CollectionSchema'
      shards_num:
        type: integer
      size:
        type: integer
    type: object
  apiv1.CreateBackupRequest:
    properties:
      async:
        description: |-
          Async or not: return after the job is registered instead of waiting for
          it to settle.
        type: boolean
      backup_name:
        description: 'Backup name, validated server-side: numbers, letters and underscores.'
        type: string
      backup_root_path:
        description: Backup root path, overriding the config for this call.
        type: string
      collection_names:
        description: |-
          Collection names to backup, empty to backup all.

          Deprecated: use filter.
        items:
          type: string
        type: array
      db_collections:
        description: |-
          Database and collections to backup. Accepts both shapes it always has:
          a JSON string holding a JSON object, or the object itself.

          Deprecated: use filter.
        type: string
      drop_snapshot_if_exists:
        description: |-
          Drop a snapshot of the same name before creating the backup's own, so a
          leftover from an earlier run that died mid-flight cannot fail the create.
          Snapshot format only.
        type: boolean
      filter:
        additionalProperties:
          $ref: '#/definitions/apiv1.CollFilter'
        description: 'Filter for backup: database name to its collection list.'
        type: object
      force:
        description: |-
          Force backup skip flush. Data must already be on disk when using it.

          Deprecated: set strategy=skip_flush instead.
        type: boolean
      format:
        description: |-
          Format for backup, one of [auto, binlog, snapshot]; auto selects when
          unset.
        type: string
      gc_pause_address:
        description: Gc pause API address.
        type: string
      gc_pause_enable:
        description: |-
          Stop GC during the backup so the data to backup is not compacted or
          GCed away; use it when the data is very large.
        type: boolean
      gc_pause_seconds:
        description: |-
          Gc pause seconds, set it larger than the time cost of the backup.

          Deprecated: the server derives it from the config.
        type: integer
      meta_only:
        description: |-
          Only backup meta, including collection schema and index info.

          Deprecated: set strategy=meta_only instead.
        type: boolean
      rbac:
        description: Whether backup RBAC.
        type: boolean
      requestId:
        description: Uuid of request, defaults to a generated one when unset.
        type: string
      strategy:
        description: |-
          Strategy for backup, one of [meta_only, skip_flush, bulk_flush,
          serial_flush]; auto selects when unset.
        type: string
      with_index_extra:
        description: Also copy index-extra params (build_level and friends) verbatim.
        type: boolean
    type: object
  apiv1.DeleteBackupResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/backuppb.ResponseCode'
        description: Response code. 0 means success, others fail. Absent on success.
      msg:
        description: Error msg if fail.
        type: string
      requestId:
        description: Uuid of the request answered.
        type: string
    type: object
  apiv1.ListBackupsResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/backuppb.ResponseCode'
        description: Response code. 0 means success, others fail. Absent on success.
      data:
        description: Backup info entities; null when there are none.
        items:
          $ref: '#/definitions/apiv1.BackupSummary'
        type: array
      msg:
        description: Error msg if fail.
        type: string
      requestId:
        description: Uuid of the request answered.
        type: string
    type: object
  apiv1.RestoreBackupRequest:
    properties:
      async:
        description: 'Execute asynchronously: return after the job is registered.'
        type: boolean
      backup_name:
        description: Backup name to restore.
        type: string
      bucket_name:
        description: Bucket name; with path, overrides the config for this call.
        type: string
      collection_names:
        description: Collections to restore.
        items:
          type: string
        type: array
      collection_renames:
        additionalProperties:
          type: string
        description: Rename the restored collections by map; wins over collection_suffix.
        type: object
      collection_suffix:
        description: Rename the restored collections by appending a suffix.
        type: string
      db_collections:
        description: |-
          Database and collections to restore, for example
          {"db1":["collection1"],"db2":["collection2","collection3"]}. Accepts
          both shapes it always has: a JSON string holding a JSON object, or the
          object itself.
        type: string
      db_collections_after_rename:
        description: |-
          Which database and collections to restore after rename. Accepts both
          shapes db_collections accepts.
        type: string
      dropExistCollection:
        description: Drop existing target collection before create.
        type: boolean
      dropExistIndex:
        description: Drop existing index of target collection before create.
        type: boolean
      ezkMapping:
        additionalProperties:
          type: string
        description: Map of old ezk to new ezk, replacing encryption keys during restore.
        type: object
      id:
        description: Restore task id, defaults to a generated one when unset.
        type: string
      maxShardNum:
        description: Target max shard number.
        type: integer
      metaOnly:
        description: Only restore meta, not data.
        type: boolean
      path:
        description: Path; with bucket_name, overrides the config for this call.
        type: string
      rbac:
        description: Whether restore RBAC.
        type: boolean
      requestId:
        description: Uuid of request, defaults to a generated one when unset.
        type: string
      restoreIndex:
        description: Restore index info.
        type: boolean
      restorePlan:
        allOf:
        - $ref: '#/definitions/apiv1.RestorePlan'
        description: Per-database restore plan with renames and a task filter.
      secondaries:
        description: |-
          REST endpoints of the secondary clusters that replicate this target,
          e.g. http://10.0.0.2:19530; when set, every import job is committed
          two-phase so its mirror commits on every secondary.
        items:
          type: string
        type: array
      skipCreateCollection:
        description: |-
          Skip collection create; use when the collection exists and only index
          or data is restored.
        type: boolean
      skipImportDiskQuotaCheck:
        description: |-
          Skip the disk quota check in import.

          Deprecated: the check follows the config.
        type: boolean
      skipParams:
        allOf:
        - $ref: '#/definitions/apiv1.SkipParams'
        description: Skip the named params in the restore process.
      strategy:
        description: |-
          Strategy for restore, one of [auto, per_seg, merged_seg, restore_snap,
          import_snap]; auto, like leaving the field unset, lets the restore pick
          the plan against the backup's format.
        type: string
      truncateBinlogByTs:
        description: Truncate binlog by timestamp, for cdc.
        type: boolean
      useAutoIndex:
        description: Use autoindex when restoring vector index.
        type: boolean
      useV2Restore:
        description: 'Deprecated: set strategy=merged_seg instead.'
        type: boolean
    type: object
  apiv1.RestoreBackupResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/backuppb.ResponseCode'
        description: Response code. 0 means success, others fail. Absent on success.
      data:
        allOf:
        - $ref: '#/definitions/apiv1.RestoreBackupTaskResponse'
        description: Restore task info entity; null when the response carries none.
      msg:
        description: Error msg if fail.
        type: string
      requestId:
        description: |-
          Uuid of the request answered; absent on the failures a request answers
          before its id is known.
        type: string
    type: object
  apiv1.RestoreBackupTaskResponse:
    properties:
      collection_restore_tasks:
        items:
          $ref: '#/definitions/apiv1.RestoreCollectionTaskResponse'
        type: array
      end_time:
        type: integer
      errorMessage:
        type: string
      id:
        type: string
      progress:
        type: integer
      start_time:
        type: integer
      state_code:
        $ref: '#/definitions/backuppb.RestoreTaskStateCode'
    type: object
  apiv1.RestoreCollectionMapping:
    properties:
      override:
        $ref: '#/definitions/apiv1.RestoreCollectionOverride'
      source:
        type: string
      target:
        type: string
    type: object
  apiv1.RestoreCollectionOverride:
    properties:
      description:
        type: string
      shardNum:
        type: integer
    type: object
  apiv1.RestoreCollectionTaskResponse:
    properties:
      end_time:
        type: integer
      errorMessage:
        type: string
      id:
        type: string
      progress:
        type: integer
      start_time:
        type: integer
      state_code:
        $ref: '#/definitions/backuppb.RestoreTaskStateCode'
      target_collection_name:
        type: string
      target_db_name:
        type: string
    type: object
  apiv1.RestoreMapping:
    properties:
      colls:
        items:
          $ref: '#/definitions/apiv1.RestoreCollectionMapping'
        type: array
      source:
        description: Source database name; empty is an error.
        type: string
      target:
        description: Target database name.
        type: string
      withProp:
        description: Whether to restore with the source properties.
        type: boolean
    type: object
  apiv1.RestorePlan:
    properties:
      filter:
        additionalProperties:
          $ref: '#/definitions/apiv1.CollFilter'
        type: object
      mapping:
        items:
          $ref: '#/definitions/apiv1.RestoreMapping'
        type: array
    type: object
  apiv1.RestoreSecondaryRequest:
    properties:
      async:
        description: |-
          Async or not: return after the job is registered instead of waiting for
          it to settle.
        type: boolean
      backup_name:
        description: Backup name to restore.
        type: string
      path:
        description: Path, overriding the config for this call.
        type: string
      requestId:
        description: Uuid of request; doubles as the restore task id.
        type: string
      sourceClusterID:
        description: Cdc source cluster id.
        type: string
      targetClusterID:
        description: Cdc target cluster id.
        type: string
    type: object
  apiv1.SkipParams:
    properties:
      collectionProperties:
        items:
          type: string
        type: array
      fieldIndexParams:
        items:
          type: string
        type: array
      fieldTypeParams:
        items:
          type: string
        type: array
      indexParams:
        items:
          type: string
        type: array
    type: object
  backuppb.BackupTaskStateCode:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    format: int32
    type: integer
    x-enum-varnames:
    - BackupTaskStateCode_BACKUP_INITIAL
    - BackupTaskStateCode_BACKUP_EXECUTING
    - BackupTaskStateCode_BACKUP_SUCCESS
    - BackupTaskStateCode_BACKUP_FAIL
    - BackupTaskStateCode_BACKUP_TIMEOUT
  backuppb.CollectionSchema:
    properties:
      autoID:
        type: boolean
      description:
        type: string
      enable_dynamic_field:
        type: boolean
      fields:
        items:
          $ref: '#/definitions/backuppb.FieldSchema'
        type: array
      functions:
        items:
          $ref: '#/definitions/backuppb.FunctionSchema'
        type: array
      name:
        type: string
      properties:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
      struct_array_fields:
        items:
          $ref: '#/definitions/backuppb.StructArrayFieldSchema'
        type: array
    type: object
  backuppb.DataType:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 10
    - 11
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 26
    - 100
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 200
    - 201
    format: int32
    type: integer
    x-enum-varnames:
    - DataType_None
    - DataType_Bool
    - DataType_Int8
    - DataType_Int16
    - DataType_Int32
    - DataType_Int64
    - DataType_Float
    - DataType_Double
    - DataType_String
    - DataType_VarChar
    - DataType_Array
    - DataType_JSON
    - DataType_Geometry
    - DataType_Text
    - DataType_Timestamptz
    - DataType_BinaryVector
    - DataType_FloatVector
    - DataType_Float16Vector
    - DataType_BFloat16Vector
    - DataType_SparseFloatVector
    - DataType_Int8Vector
    - DataType_ArrayOfVector
    - DataType_ArrayOfStruct
    - DataType_Struct
  backuppb.DatabaseBackupInfo:
    properties:
      db_id:
        type: integer
      db_name:
        type: string
      ezk:
        type: string
      properties:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
    type: object
  backuppb.FieldSchema:
    properties:
      autoID:
        type: boolean
      data_type:
        $ref: '#/definitions/backuppb.DataType'
      default_value:
        $ref: '#/definitions/backuppb.ValueField'
      default_value_base64:
        type: string
      default_value_proto:
        description: 'Deprecated: Do not use.'
        type: string
      description:
        type: string
      element_type:
        $ref: '#/definitions/backuppb.DataType'
      fieldID:
        type: integer
      index_params:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
      is_dynamic:
        type: boolean
      is_function_output:
        type: boolean
      is_partition_key:
        type: boolean
      is_primary_key:
        type: boolean
      name:
        type: string
      nullable:
        type: boolean
      state:
        $ref: '#/definitions/backuppb.FieldState'
      type_params:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
    type: object
  backuppb.FieldState:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - FieldState_FieldCreated
    - FieldState_FieldCreating
    - FieldState_FieldDropping
    - FieldState_FieldDropped
  backuppb.FunctionSchema:
    properties:
      description:
        type: string
      id:
        type: integer
      input_field_ids:
        items:
          type: integer
        type: array
      input_field_names:
        items:
          type: string
        type: array
      name:
        type: string
      output_field_ids:
        items:
          type: integer
        type: array
      output_field_names:
        items:
          type: string
        type: array
      params:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
      type:
        $ref: '#/definitions/backuppb.FunctionType'
    type: object
  backuppb.FunctionType:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - FunctionType_Unknown
    - FunctionType_BM25
    - FunctionType_TextEmbedding
  backuppb.IndexInfo:
    properties:
      create_time:
        type: integer
      field_id:
        description: extra info from etcd
        type: integer
      field_name:
        type: string
      index_id:
        type: integer
      index_name:
        type: string
      index_params:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
      index_type:
        type: string
      is_auto_index:
        type: boolean
      max_index_version:
        type: integer
      min_index_version:
        type: integer
      params:
        additionalProperties:
          type: string
        type: object
      type_params:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
      user_index_params:
        items:
          $ref: '#/definitions/backuppb.KeyValuePair'
        type: array
    type: object
  backuppb.KeyValuePair:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  backuppb.RPCChannelInfo:
    properties:
      name:
        type: string
      position:
        type: string
    type: object
  backuppb.ResponseCode:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 400
    - 404
    - 503
    format: int32
    type: integer
    x-enum-varnames:
    - ResponseCode_Success
    - ResponseCode_Not_Support
    - ResponseCode_No_Permission
    - ResponseCode_Fail
    - ResponseCode_Parameter_Error
    - ResponseCode_Request_Object_Not_Found
    - ResponseCode_Storage_Not_Ready
  backuppb.RestoreTaskStateCode:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    format: int32
    type: integer
    x-enum-varnames:
    - RestoreTaskStateCode_INITIAL
    - RestoreTaskStateCode_EXECUTING
    - RestoreTaskStateCode_SUCCESS
    - RestoreTaskStateCode_FAIL
    - RestoreTaskStateCode_TIMEOUT
  backuppb.StructArrayFieldSchema:
    properties:
      description:
        type: string
      fieldID:
        type: integer
      fields:
        items:
          $ref: '#/definitions/backuppb.FieldSchema'
        type: array
      name:
        type: string
      nullable:
        description: |-
          nullable is a struct-level flag: the server propagates it to every
          sub-field, and sub-fields must not be nullable unless it is set.
        type: boolean
    type: object
  backuppb.ValueField:
    properties:
      data:
        description: "Types that are valid to be assigned to Data:\n\t*ValueField_BoolData\n\t*ValueField_IntData\n\t*ValueField_LongData\n\t*ValueField_FloatData\n\t*ValueField_DoubleData\n\t*ValueField_StringData\n\t*ValueField_BytesData"
    type: object
info:
  contact: {}
  description: A data backup & restore tool for Milvus
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Milvus Backup Service
  version: "1.0"
paths:
  /create:
    post:
      consumes:
      - application/json
      description: |-
        Create a backup with the given name and collections
        Storage preflight failures return HTTP 200 with code 503 (Storage_Not_Ready), without registering a task. The caller may retry the same request.
        A backup name whose artifact directory already exists fails with code Fail, also without registering a task.
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: CreateBackupRequest JSON
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/apiv1.CreateBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.BackupInfoResponse'
      summary: Create backup interface
      tags:
      - Backup
  /delete:
    delete:
      description: Delete a backup with the given name
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: backup_name
        in: query
        name: backup_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.DeleteBackupResponse'
      summary: Delete backup interface
      tags:
      - Backup
  /get_backup:
    get:
      description: Get the backup with the given name or id
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: backup_name
        in: query
        name: backup_name
        type: string
      - description: backup_id
        in: query
        name: backup_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.BackupInfoResponse'
      summary: Get backup interface
      tags:
      - Backup
  /get_restore:
    get:
      description: Get restore task state with the given id
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: id
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.RestoreBackupResponse'
      summary: Get restore interface
      tags:
      - Restore
  /list:
    get:
      description: List all backups in current storage
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: collection_name
        in: query
        name: collection_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.ListBackupsResponse'
      summary: List Backups interface
      tags:
      - Backup
  /restore:
    post:
      consumes:
      - application/json
      description: Submit a request to restore the data from backup
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: RestoreBackupRequest JSON
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/apiv1.RestoreBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.RestoreBackupResponse'
      summary: Restore interface
      tags:
      - Restore
  /restore_secondary:
    post:
      consumes:
      - application/json
      description: Submit a request to restore the data from backup
      parameters:
      - description: request_id
        in: header
        name: request_id
        type: string
      - description: RestoreSecondaryRequest JSON
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/apiv1.RestoreSecondaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.RestoreBackupResponse'
      summary: Restore interface
      tags:
      - Restore
swagger: "2.0"
