# Milvus on Azure Blob Storage, with backups kept in a second container of the
# same storage account.
#
# Both ends are the same account, so the default transfer mode (auto) lets
# Azure copy the blobs rather than streaming them through milvus-backup.
configVersion: v2

milvus:
  user: "root"
  password: "Milvus"

  grpc:
    address: localhost
    port: 19530

  # Milvus storage configs, make them the same with milvus config.
  storage:
    provider: "azure"
    address: core.windows.net
    port: 443
    region: "westus2"
    useSSL: true
    # The Azure storage account, required by the azure provider. Prefer
    # MILVUS_STORAGE_ACCOUNT_NAME over writing it here.
    accountName: "<your-storage-account>"
    # For azure the bucket is the blob container.
    bucketName: "milvus-data"
    rootPath: "milvus/azure-instance"

    auth:
      # Azure signs with the account name and one of its access keys.
      type: sharedKey
      # Prefer MILVUS_STORAGE_AUTH_ACCOUNT_KEY over writing the key here.
      accountKey: "<your-account-key>"

backup:
  # The provider, endpoint and region are inherited from milvus.storage; only
  # the container, the root path and the credentials are named again.
  storage:
    accountName: "<your-storage-account>"
    # Backup data is stored under bucketName/rootPath.
    bucketName: "milvus-data"
    rootPath: "backup"

    auth:
      type: sharedKey
      # Prefer BACKUP_STORAGE_AUTH_ACCOUNT_KEY over writing the key here.
      accountKey: "<your-account-key>"
